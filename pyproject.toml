[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-knowledge-system"
version = "0.1.0"
description = "Local-first experimental knowledge database for laser processing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "PyQtGraph>=0.13,<1",
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["laser_knowledge_system", "laser_knowledge_system.domain", "laser_knowledge_system.db", "laser_knowledge_system.analysis", "laser_knowledge_system.ui"]
